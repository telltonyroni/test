<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>My Product Tour</title>
<link rel="stylesheet" href="player.css" />
</head>
<body>
<main class="player">
  <div class="canvas" id="canvas" tabindex="0">
    <img id="bgImage" alt="Step background" />
    <svg id="overlay" class="overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <mask id="spotMask">
          <rect x="0" y="0" width="100%" height="100%" fill="white"></rect>
          <rect id="spotHoleRect" x="0" y="0" width="0" height="0" rx="12" ry="12" fill="black"></rect>
          <circle id="spotHoleCircle" cx="0" cy="0" r="0" fill="black"></circle>
        </mask>
      </defs>
      <rect class="dim" x="0" y="0" width="100%" height="100%" mask="url(#spotMask)"></rect>
    </svg>
    <div id="tooltip" class="tooltip" role="dialog" aria-live="polite" data-style="dark" data-arrow="true">
      <h3 id="tipTitle"></h3>
      <p id="tipDesc"></p>
      <div class="tip-actions"><a id="ctaLink" href="#" target="_blank" rel="noopener"><button id="ctaBtn">Next</button></a></div>
      <div id="tipArrow" class="tip-arrow"></div>
    </div>
  </div>
  <footer class="player-footer">
    <div class="dots" id="dots" aria-label="Progress"></div>
    <div class="pager">
      <span id="hotCounter" class="muted"></span>
      <div class="sep small"></div>
      <button id="prevBtn">← Prev (P)</button>
      <span id="stepCounter">1 / 1</span>
      <button id="nextBtn">Next (N) →</button>
    </div>
  </footer>
</main>
<script src="player.js" defer></script>
</body>
</html>
